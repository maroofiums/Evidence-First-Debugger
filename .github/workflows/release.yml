name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python scripts/validate_skill.py
      - name: Build skill package
        run: ./scripts/build_skill.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/evidence-first-debugger.skill
          generate_release_notes: true
