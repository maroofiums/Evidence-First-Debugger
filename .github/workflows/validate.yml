name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run structure and link checks
        run: python scripts/validate_skill.py

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Mermaid parser
        run: npm install --prefix scripts
      - name: Validate Mermaid diagrams
        run: node check_mermaid.mjs ../README.md
        working-directory: scripts
