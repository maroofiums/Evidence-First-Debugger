<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="12" height="640" fill="#2f81f7"/>
  <text x="80" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">CLAUDE SKILL  |  AGENTS.md  |  CURSOR  |  COPILOT</text>
  <text x="80" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="84" font-weight="bold" fill="#f0f6fc">Evidence-First</text>
  <text x="80" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="84" font-weight="bold" fill="#2f81f7">Debugger</text>
  <text x="80" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#c9d1d9">Evidence. Ranked hypotheses. Minimal fixes.</text>
  <text x="80" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#c9d1d9">Regression tests. No unverified claims.</text>
  <g font-family="DejaVu Sans Mono, Courier New, monospace" font-size="26" font-weight="bold">
    <rect x="80" y="520" width="190" height="52" rx="8" fill="#12261e" stroke="#3fb950"/>
    <text x="175" y="555" text-anchor="middle" fill="#3fb950">VERIFIED</text>
    <rect x="290" y="520" width="330" height="52" rx="8" fill="#2a2210" stroke="#d29922"/>
    <text x="455" y="555" text-anchor="middle" fill="#d29922">PARTIALLY VERIFIED</text>
    <rect x="640" y="520" width="215" height="52" rx="8" fill="#2d1517" stroke="#f85149"/>
    <text x="747" y="555" text-anchor="middle" fill="#f85149">UNVERIFIED</text>
  </g>
  <g font-family="DejaVu Sans Mono, Courier New, monospace" font-size="22">
    <rect x="880" y="190" width="340" height="360" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="905" y="240" fill="#8b949e">hypotheses</text>
    <text x="905" y="290" fill="#c9d1d9">H1  confirmed</text>
    <text x="905" y="335" fill="#8b949e">H2  eliminated</text>
    <text x="905" y="380" fill="#8b949e">H3  inconclusive</text>
    <line x1="905" y1="410" x2="1195" y2="410" stroke="#30363d"/>
    <text x="905" y="455" fill="#8b949e">before fix  <tspan fill="#f85149">FAIL</tspan></text>
        <text x="905" y="500" fill="#8b949e">after fix   <tspan fill="#3fb950">PASS</tspan></text>
  </g>
</svg>
